name: UI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to run
        default: chromium
        type: choice
        options: [chromium, firefox, webkit]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # Downloads the browser and the Linux libraries it needs.
      - run: mvn -B exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps ${{ inputs.browser || 'chromium' }}"
      - run: mvn -B test -Dbrowser=${{ inputs.browser || 'chromium' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/allure-results/
            target/traces/
