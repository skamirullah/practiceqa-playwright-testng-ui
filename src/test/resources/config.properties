# Defaults. Override any of these with -Dname=value or an environment variable (BASE_URL, BROWSER, HEADLESS, SLOW_MO).
base.url=https://www.practiceqaautomation.com
# chromium | firefox | webkit
browser=chromium
headless=true
# Milliseconds to pause between actions; useful when watching a headed run.
slow.mo=0
# Milliseconds an action or assertion waits before failing.
timeout=10000
